<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Models News Hub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FAF6EF'/%3E%3Cpath d='M0 0h32v5H0z' fill='%23C43A24'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='17' font-weight='700' fill='%232C2416' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================
     RESET & BASE
  ============================================ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #f5f0e6;
    --surface:   #faf6ef;
    --surface2:  #efe8d8;
    --border:    #d4c9b0;
    --text:      #2c2416;
    --text2:     #8a7a64;
    --accent:    #c43a24;
    --accent-hover: #a82e1a;
    --link:      #8b3a2a;
    --link-hover: #6a2a1e;
    --green:     #3a7a4a;
    --teal:      #3a7a8a;
    --red:       #c43a24;
    --gold:      #b8963a;
    --radius:    4px;
    --max-w:     1200px;
  }

  html { font-size: 16px; }

  body {
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--link); text-decoration: none; transition: color .2s; }
  a:hover { color: var(--link-hover); }

  .container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

  /* ============================================
     HEADER — Magazine Masthead Style
  ============================================ */
  header {
    padding: 32px 0 16px;
    border-bottom: 2px solid var(--text);
    background: var(--surface);
  }
  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .masthead-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .masthead-suptitle {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 36px;
    font-weight: 800;
    font-style: italic;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .masthead-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .header-status {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }
  .header-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text2);
  }
  .refresh-btn {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .25s;
    line-height: 1;
  }
  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .refresh-btn:disabled { opacity: .4; cursor: wait; }
  .refresh-btn.spinning svg { animation: spin-refresh .6s linear infinite; }
  @keyframes spin-refresh { to { transform: rotate(360deg); } }

  /* ============================================
     DIVIDER (decorative rule below masthead)
  ============================================ */
  .masthead-divider {
    margin-top: 16px;
    height: 1px;
    background: linear-gradient(90deg, var(--border) 0%, var(--border) 40%, transparent 100%);
  }

  /* ============================================
     CONTROLS BAR
  ============================================ */
  .controls {
    padding: 20px 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .controls-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .controls-top {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .controls-label {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text2);
    margin-right: 4px;
  }
  .search-box {
    flex: 1;
    min-width: 180px;
    font-family: 'Source Serif 4', serif;
    font-size: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color .2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text2); font-style: italic; }

  .lang-filters {
    display: flex;
    gap: 2px;
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 2px;
  }
  .lang-pill {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 500;
    background: transparent;
    border: none;
    color: var(--text2);
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all .2s;
  }
  .lang-pill:hover { color: var(--text); }
  .lang-pill.active {
    background: var(--text);
    color: var(--surface);
  }

  .source-filters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .source-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 3px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    position: relative;
  }
  .source-pill::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 50%;
    width: 0; height: 2px;
    background: var(--accent);
    transition: all .25s;
    transform: translateX(-50%);
  }
  .source-pill:hover {
    color: var(--text);
    border-color: var(--text2);
  }
  .source-pill:hover::after { width: 60%; }
  .source-pill.active {
    border-color: var(--text);
    color: var(--text);
    background: var(--surface2);
  }
  .source-pill.active::after { width: 60%; background: var(--text); }
  .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text2);
    margin-left: 4px;
  }
  .source-pill.active .count-badge { color: var(--text); }

  .source-status {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    color: var(--text2);
  }
  .source-status .ok { color: var(--green); }
  .source-status .err { color: var(--red); }

  /* ============================================
     ARTICLES LIST
  ============================================ */
  .articles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 28px;
  }

  .article-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 20px 16px;
    opacity: 0;
    transform: translateY(8px);
    animation: article-in .35s ease forwards;
    transition: border-color .2s, box-shadow .2s;
    min-width: 0;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  .article-item:hover {
    border-color: var(--text2);
    box-shadow: 0 2px 12px rgba(44,36,22,.06);
  }
  @keyframes article-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .article-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  .article-title a {
    color: var(--text);
    text-decoration: none;
    transition: color .2s;
  }
  .article-title a:hover { color: var(--link); }

  .article-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .article-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .lang-badge {
    font-family: 'Outfit', sans-serif;
    font-size: 9px;
    font-weight: 600;
    color: var(--teal);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .article-date {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    color: var(--text2);
  }

  .article-desc {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ============================================
     LOADING / EMPTY STATES
  ============================================ */
  .loading-state, .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
  }
  .loading-icon {
    font-size: 48px;
    margin-bottom: 16px;
    animation: pulse-load 1.2s ease-in-out infinite;
    display: block;
  }
  @keyframes pulse-load {
    0%, 100% { transform: scale(1); opacity: .6; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  .loading-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    font-style: italic;
    color: var(--text2);
  }
  .loading-sub {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    color: var(--text2);
    margin-top: 8px;
  }

  .empty-state p {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    font-style: italic;
    color: var(--text2);
  }

  /* ============================================
     TOAST
  ============================================ */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: var(--surface);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    z-index: 200;
    display: none;
    max-width: 400px;
    box-shadow: 0 4px 16px rgba(44,36,22,.15);
  }

  /* ============================================
     SIDEBAR — OpenRouter (removed)
  ============================================ */
  .sidebar { display: none; }
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 120px;
  }
  .sidebar-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .sidebar-header {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-item:last-child { border-bottom: none; }
  .sidebar-rank {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text2);
    min-width: 20px;
    line-height: 1.4;
  }
  .sidebar-item-content {
    flex: 1;
    min-width: 0;
  }
  .sidebar-item-name {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-item-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text2);
    margin-top: 2px;
  }
  .sidebar-loading {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 13px;
    font-style: italic;
    color: var(--text2);
    padding: 8px 0;
  }

  /* ============================================
     RESPONSIVE
  ============================================ */
  @media (max-width: 720px) {
    .container { padding: 0 16px; }
    header { padding: 20px 0 12px; }
    .masthead { flex-direction: column; align-items: flex-start; }
    h1 { font-size: 28px; }
    .masthead-right { width: 100%; justify-content: flex-start; }
    .article-title { font-size: 18px; }
    .controls-top { flex-direction: column; }
    .search-box { min-width: 100%; }
    .article-item { padding: 16px; }
  }

  @media (max-width: 540px) {
    .articles { grid-template-columns: 1fr; gap: 14px; }
    h1 { font-size: 24px; }
    .article-title { font-size: 16px; }
    .article-desc { -webkit-line-clamp: 3; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- HEADER — Magazine Masthead -->
<header>
  <div class="container">
    <div class="masthead">
      <div class="masthead-left">
        <span class="masthead-suptitle">AI Intelligence</span>
        <h1>Models News Hub</h1>
      </div>
      <div class="masthead-right">
        <span class="header-status"><span class="status-dot"></span><span id="statusText">Loading</span></span>
        <span class="header-count" id="countText">0</span>
        <button class="refresh-btn" id="refreshBtn" onclick="loadNews()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Refresh
        </button>
      </div>
    </div>
    <div class="masthead-divider"></div>
  </div>
</header>

<!-- CONTROLS -->
<div class="controls">
  <div class="container">
    <div class="controls-row">
      <div class="controls-top">
        <span class="controls-label">Search</span>
        <input class="search-box" id="searchInput" placeholder="Search headlines and summaries..." oninput="applyFilters()">
        <div class="lang-filters" id="langFilters">
          <button class="lang-pill active" data-lang="" onclick="setLang('')">All</button>
          <button class="lang-pill" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="lang-pill" data-lang="zh" onclick="setLang('zh')">中文</button>
        </div>
      </div>
      <div class="source-filters" id="sourceFilters"></div>
      <div class="source-status" id="sourceStatus"></div>
    </div>
  </div>
</div>

<!-- ARTICLES -->
<div class="container">
  <div class="content-area">
    <div class="articles" id="articles">
      <div class="loading-state">
        <span class="loading-icon">&#x1F4D0;</span>
        <div class="loading-text">Gathering the latest from global sources</div>
        <div class="loading-sub">ArXiv &middot; Hugging Face &middot; Reddit &middot; Google News &middot; 中文源</div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
let allArticles = [];
let activeSource = null;
let activeLang = '';
let refreshInterval;

async function loadNews() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.classList.add('spinning');

  try {
    const res = await fetch('/api/news');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allArticles = data.articles;
    renderSources(data);
    renderArticles();
    updateStatus(data);
  } catch (err) {
    showToast('Failed to fetch: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

function renderSources(data) {
  const sourceMap = {};
  for (const a of allArticles) {
    sourceMap[a.source] = (sourceMap[a.source] || 0) + 1;
  }
  const sources = Object.entries(sourceMap).sort((a, b) => b[1] - a[1]);

  const container = document.getElementById('sourceFilters');
  container.innerHTML = '<button class="source-pill' + (activeSource === null ? ' active' : '') + '" data-source="" onclick="setSource(\'\')">All<span class="count-badge">' + allArticles.length + '</span></button>';

  for (const [name, count] of sources) {
    const pill = document.createElement('button');
    pill.className = 'source-pill' + (activeSource === name ? ' active' : '');
    pill.dataset.source = name;
    pill.textContent = name;
    const badge = document.createElement('span');
    badge.className = 'count-badge';
    badge.textContent = count;
    pill.appendChild(badge);
    pill.onclick = () => setSource(name);
    container.appendChild(pill);
  }

  // Source status
  const statusEl = document.getElementById('sourceStatus');
  if (data.errors && data.errors.length > 0) {
    statusEl.innerHTML = '<span class="ok">\u2713 ' + data.successfulSources + '/' + data.totalSources + '</span> <span class="err">\u2717 ' + data.errors.map(e => e.source).join(', ') + '</span>';
  } else {
    statusEl.innerHTML = '<span class="ok">\u2713 ' + data.successfulSources + '/' + data.totalSources + ' sources</span>';
  }
}

function setSource(name) {
  activeSource = name || null;
  document.querySelectorAll('.source-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.source === (name || ''));
  });
  renderArticles();
}

function setLang(lang) {
  activeLang = lang;
  document.querySelectorAll('.lang-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.lang === lang);
  });
  renderArticles();
}

function applyFilters() {
  renderArticles();
}

function renderArticles() {
  const container = document.getElementById('articles');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  let filtered = allArticles;
  if (activeLang) {
    filtered = filtered.filter(a => a.lang === activeLang);
  }
  if (activeSource) {
    filtered = filtered.filter(a => a.source === activeSource);
  }
  if (search) {
    filtered = filtered.filter(a =>
      (a.title && a.title.toLowerCase().includes(search)) ||
      (a.description && a.description.toLowerCase().includes(search))
    );
  }

  document.getElementById('countText').textContent = filtered.length;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>No articles found</p></div>';
    return;
  }

  container.innerHTML = filtered.map((a, i) => {
    const date = a.pubDate ? formatDate(a.pubDate) : '';
    const desc = truncate(a.description, 280);
    return '<div class="article-item" style="animation-delay:' + (i * 0.03) + 's">' +
      '<div class="article-title"><a href="' + escapeHtml(a.link) + '" target="_blank" rel="noopener">' + escapeHtml(a.title || '(no title)') + '</a></div>' +
      '<div class="article-meta">' +
        '<span class="article-source">' + escapeHtml(a.source) + '</span>' +
        (a.lang ? '<span class="lang-badge">' + (a.lang === 'zh' ? '中文' : 'EN') + '</span>' : '') +
        (date ? '<span class="article-date">' + date + '</span>' : '') +
      '</div>' +
      (desc ? '<div class="article-desc">' + escapeHtml(desc) + '</div>' : '') +
    '</div>';
  }).join('');
}

function updateStatus(data) {
  const elapsed = Math.floor((Date.now() - data.lastFetched) / 1000);
  const el = document.getElementById('statusText');
  el.textContent = elapsed < 120 ? 'Live \u00b7 ' + elapsed + 's' : 'Live';
}

function formatDate(dateStr) {
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    const now = new Date();
    const diff = now - d;
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return dateStr; }
}

function truncate(str, max) {
  if (!str || str.length <= max) return str || '';
  return str.slice(0, max).replace(/\s+\S*$/, '') + '\u2026';
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

function startAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(loadNews, 60000);
}

loadNews();
startAutoRefresh();
</script>
</body>
</html>
